name: Python build and test
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  windows:
    name: Tier 1 / Windows AMD64 (Python)
    runs-on: windows-latest
    env:
      # Redirected Windows output can otherwise use cp1252. Keep the parent
      # build script and its Python subprocesses on the same UTF-8 encoding.
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip-app
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        working-directory: apps/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            apps/python/requirements*.lock
            .github/workflows/python.yml
      - run: python -m pip install -r ../../requirements-build.txt
      - if: inputs.release_tag == ''
        run: python ../../scripts/release_version.py --generate-python
      - if: inputs.release_tag != ''
        run: python ../../scripts/release_version.py --write
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install PyInstaller
      - run: python scripts/build.py --skip-installer
      - if: inputs.release_tag != ''
        run: Copy-Item ../../build/release-version.json dist/sysu_netauth/
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Python-Windows
          path: apps/python/dist/sysu_netauth/
          if-no-files-found: error
          overwrite: true
