name: Python build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/python/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install PyInstaller
      - run: python scripts/build.py --skip-installer
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Python-Windows
          path: apps/python/dist/sysu_netauth/
