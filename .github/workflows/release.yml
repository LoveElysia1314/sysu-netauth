name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # Avoid restoring the much larger Python GUI dependency cache in metadata jobs.
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip-build

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - id: version
        name: Resolve release tag
        run: python scripts/release_version.py --write --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-release-metadata
          path: build/release-version.json
          if-no-files-found: error
          overwrite: true
  packaging-tests:
    name: Tier ${{ matrix.tier }} / Packaging tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            tier: 1
          - os: ubuntu-latest
            tier: 2
      fail-fast: false
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: python -m unittest discover -s tests -v
  rust:
    name: Tier 1–2 / Rust
    needs: version
    uses: ./.github/workflows/rust.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
      skip_macos: true
  macos:
    name: Tier 3 / macOS (advisory)
    needs: version
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
  python:
    name: Tier 1 / Python
    needs: version
    uses: ./.github/workflows/python.yml
    with:
      release_tag: ${{ needs.version.outputs.tag }}
  installers:
    name: Tier ${{ matrix.tier }} / Installer (${{ matrix.label }})
    needs: [version, rust, python, packaging-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rust
            os: windows-latest
            tier: 1
            arch: x64
            abi: msvc
            label: rust-msvc-x64
            artifact: sysu-netauth-Rust-Windows-msvc
            # Rust CI uploads dist/, including its sysu_netauth subdirectory.
            input: dist/build-input/sysu_netauth
          - variant: rust
            os: windows-11-arm
            tier: 2
            arch: arm64
            abi: msvc
            label: rust-msvc-arm64
            artifact: sysu-netauth-Rust-Windows-msvc-arm64
            input: dist/build-input/sysu_netauth
          - variant: rust
            os: windows-latest
            tier: 1
            arch: x64
            abi: gnu
            label: rust-gnu-x64
            artifact: sysu-netauth-Rust-Windows-gnu
            input: dist/build-input/sysu_netauth
          - variant: python
            os: windows-latest
            tier: 1
            arch: x64
            abi: ''
            label: python-x64
            artifact: sysu-netauth-Python-Windows
            # Python CI uploads the contents of the PyInstaller directory.
            input: dist/build-input
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      NETAUTH_RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/build-input
      - name: Generate matching installer metadata from tag
        run: python scripts/release_version.py --write
      - name: Verify Rust CLI version on Windows
        if: matrix.variant == 'rust'
        env:
          APP_INPUT: ${{ matrix.input }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $actual = & (Join-Path $env:APP_INPUT 'sysu_netauth.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne "sysu-netauth $env:EXPECTED_VERSION") {
            throw "Rust executable version mismatch: $actual"
          }
      - name: Package existing build with Inno Setup
        # Inno Setup 6 is preinstalled on the Windows hosted runner.
        env:
          APP_VARIANT: ${{ matrix.variant }}
          APP_ABI: ${{ matrix.abi }}
          APP_ARCH: ${{ matrix.arch }}
          APP_INPUT: ${{ matrix.input }}
        run: |
          $abiArgs = @()
          if ($env:APP_ABI) { $abiArgs = @('--abi', $env:APP_ABI) }
          python scripts/package_windows.py --variant "$env:APP_VARIANT" --arch "$env:APP_ARCH" --input-dir "$env:APP_INPUT" @abiArgs
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Windows-installers-${{ matrix.label }}
          path: dist/windows-installers/
          if-no-files-found: error
          overwrite: true
  release-assets:
    name: Tier 1–2 / Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sysu-netauth-Windows-installers-*
          path: dist/release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sysu-netauth-Rust-Linux
          path: dist/linux-build
      - uses: actions/download-artifact@v4
        with:
          name: sysu-netauth-release-metadata
          path: build
      - name: Prepare and verify all required release assets
        run: >-
          python3 scripts/prepare_release_assets.py --metadata build/release-version.json
          --tier 1 --tier 2
          --linux-input dist/linux-build/sysu-netauth-linux-x64.tar.gz
          --output-dir dist/release-assets
      - name: Upload packages or create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true ]; then
              gh release edit "$RELEASE_TAG" --prerelease="$PRERELEASE"
            fi
          else
            gh release create "$RELEASE_TAG" dist/release-assets/* \
              --verify-tag --draft --title "SYSU NetAuth $RELEASE_TAG" \
              --prerelease="$PRERELEASE" \
              --notes-file .github/windows-release-notes.md
          fi
  macos-release-assets:
    name: Tier 3 / macOS ${{ matrix.arch }} release assets (advisory)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, macos, release-assets]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sysu-netauth-Rust-macOS-${{ matrix.arch }}
          path: dist/macos-build
      - uses: actions/download-artifact@v4
        with:
          name: sysu-netauth-release-metadata
          path: build
      - name: Verify advisory release assets
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: >-
          python3 scripts/prepare_release_assets.py --metadata build/release-version.json
          --tier 3 --macos-arch "$MACOS_ARCH"
          --macos-"$MACOS_ARCH"-input "dist/macos-build/sysu-netauth-macos-$MACOS_ARCH.tar.gz"
          --output-dir dist/release-assets
      - name: Upload verified macOS packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber
      - name: Report missing advisory assets
        if: failure()
        run: echo '::warning::Tier 3 macOS assets were not uploaded; required Windows and Linux assets are unaffected.'
