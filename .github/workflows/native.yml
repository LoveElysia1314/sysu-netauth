name: Native build and test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - if: runner.os == 'Linux'
        run: cargo test --locked --test linux_network -- --ignored --nocapture
      - if: runner.os == 'Windows'
        run: ./apps/native/scripts/build.ps1 -SkipInstaller
      - if: runner.os == 'Linux'
        run: sh apps/native/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-${{ runner.os }}
          path: apps/native/dist/
  windows-cross:
    runs-on: ubuntu-latest
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/target/xwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld zip
      - uses: actions/cache@v4
        with:
          path: target/xwin
          key: xwin-linux-x64-0.23.1
      - run: cargo install --locked cargo-xwin --version 0.23.1
      - run: sh apps/native/scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Windows-from-Linux
          path: apps/native/dist/sysu-netauth-windows-x64.zip
