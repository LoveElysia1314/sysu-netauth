name: Rust build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Test isolated Linux networking
        if: runner.os == 'Linux'
        env:
          # Build as the runner user; elevate only the test executable. Ubuntu
          # runners can restrict the unprivileged user namespaces used locally.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -n --
        run: cargo test --locked --test linux_network -- --ignored --nocapture
      - if: runner.os == 'Windows'
        run: ./apps/rust/scripts/build.ps1 -SkipInstaller
      - if: runner.os == 'Windows' && inputs.release_tag != ''
        run: Copy-Item build/release-version.json apps/rust/dist/sysu_netauth/
      - if: runner.os == 'Linux'
        run: sh apps/rust/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-${{ runner.os }}${{ runner.os == 'Windows' && '-msvc' || '' }}
          path: apps/rust/dist/
          if-no-files-found: error
          overwrite: true
  windows-gnu:
    runs-on: ubuntu-latest
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: sh apps/rust/scripts/build-windows-gnu.sh
      - if: inputs.release_tag != ''
        run: cp build/release-version.json apps/rust/dist/gnu/sysu_netauth/
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-gnu
          path: apps/rust/dist/gnu/
          if-no-files-found: error
          overwrite: true
  windows-cross:
    runs-on: ubuntu-latest
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/target/xwin
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld zip
      - uses: actions/cache@v4
        with:
          path: target/xwin
          key: xwin-linux-x64-0.23.1
      - run: cargo install --locked cargo-xwin --version 0.23.1
      - run: sh apps/rust/scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-msvc-from-Linux
          path: apps/rust/dist/sysu-netauth-windows-x64.zip
          if-no-files-found: error
          overwrite: true
