name: Rust build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
      skip_macos:
        type: boolean
        default: false
permissions:
  contents: read
env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip-build
jobs:
  test:
    name: Tier ${{ matrix.tier }} / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tier: 2
            platform: Linux AMD64
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            tier: 1
            platform: Windows AMD64 (MSVC)
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            tier: 2
            platform: Windows AARCH64
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'Windows' || inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Ordinary Windows jobs only run standard-library installer tests.
          cache: ${{ inputs.release_tag != '' && 'pip' || '' }}
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-${{ matrix.target }}
          components: rustfmt, clippy
      - name: Verify Windows Rust host architecture
        if: runner.os == 'Windows'
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          $hostLine = rustc -vV | Select-String '^host: '
          if ($LASTEXITCODE -ne 0 -or "$hostLine" -ne "host: $env:EXPECTED_HOST") {
            throw "Unexpected Rust host: $hostLine"
          }
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-${{ matrix.os }}-${{ matrix.arch }}
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Test Windows installer process and service handling
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p "test_windows_installer*.py" -v
      - name: Test isolated Linux networking
        if: runner.os == 'Linux'
        env:
          # Build as the runner user; elevate only the test executable. Ubuntu
          # runners can restrict the unprivileged user namespaces used locally.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -n --
        run: cargo test --locked --test linux_network -- --ignored --nocapture
      - if: runner.os == 'Windows'
        run: ./apps/rust/scripts/build.ps1 -SkipInstaller -Target ${{ matrix.target }}
      - if: runner.os == 'Windows' && inputs.release_tag != ''
        run: |
          $dist = if ('${{ matrix.arch }}' -eq 'arm64') { 'apps/rust/dist/arm64/sysu_netauth' } else { 'apps/rust/dist/sysu_netauth' }
          Copy-Item build/release-version.json $dist
      - if: runner.os == 'Linux'
        run: sh apps/rust/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-${{ runner.os }}${{ runner.os == 'Windows' && '-msvc' || '' }}${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: apps/rust/dist/${{ matrix.arch == 'arm64' && 'arm64/' || '' }}
          if-no-files-found: error
          overwrite: true
  windows-gnu:
    name: Tier 1 / Windows AMD64 (GNU)
    runs-on: ubuntu-latest
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: ./.github/actions/cache-apt
        with:
          packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-windows-gnu
          cache-bin: false
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: sh apps/rust/scripts/build-windows-gnu.sh
      - if: inputs.release_tag != ''
        run: cp build/release-version.json apps/rust/dist/gnu/sysu_netauth/
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-gnu
          path: apps/rust/dist/gnu/
          if-no-files-found: error
          overwrite: true
  macos:
    name: Tier 3 / macOS (advisory)
    if: ${{ !inputs.skip_macos }}
    uses: ./.github/workflows/macos.yml
    with:
      release_tag: ${{ inputs.release_tag || '' }}
  windows-cross:
    name: Tier ${{ matrix.tier }} / Windows ${{ matrix.platform }} from Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            tier: 1
            platform: AMD64
            arch: x64
            directory: apps/rust/dist
          - target: aarch64-pc-windows-msvc
            tier: 2
            platform: AARCH64
            arch: arm64
            directory: apps/rust/dist/arm64
    env:
      # Keep the SDK outside target/, which rust-cache prunes before saving.
      XWIN_CACHE_DIR: ${{ github.workspace }}/.cache/xwin
      CARGO_XWIN_VERSION: '0.23.1'
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - id: cross-tools
        uses: ./.github/actions/cache-apt
        with:
          packages: clang llvm lld zip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-windows-msvc-${{ matrix.arch }}
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST XWIN NETAUTH_RC
      - name: Cache cargo-xwin executable
        id: cargo-xwin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-v1-${{ steps.cross-tools.outputs.platform }}-${{ env.CARGO_XWIN_VERSION }}
      - name: Install cargo-xwin on cache miss
        if: steps.cargo-xwin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-xwin --version "=$CARGO_XWIN_VERSION"
      - name: Verify cached cargo-xwin version
        run: test "$(cargo-xwin --version)" = "cargo-xwin $CARGO_XWIN_VERSION"
      - name: Cache Windows SDK and CRT
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ env.CARGO_XWIN_VERSION }}-${{ hashFiles('apps/rust/scripts/build-windows.sh') }}
      - run: sh apps/rust/scripts/build-windows.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-msvc-from-Linux-${{ matrix.arch }}
          path: ${{ matrix.directory }}/sysu-netauth-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          overwrite: true
  required:
    name: Tier 1–2 / Required Rust checks
    if: always()
    needs: [test, windows-gnu, windows-cross]
    runs-on: ubuntu-latest
    steps:
      - name: Require all Tier 1 and Tier 2 jobs to pass
        env:
          PLATFORM_TESTS: ${{ needs.test.result }}
          GNU_BUILD: ${{ needs.windows-gnu.result }}
          CROSS_BUILDS: ${{ needs.windows-cross.result }}
        run: |
          if [ "$PLATFORM_TESTS" != success ] || [ "$GNU_BUILD" != success ] || [ "$CROSS_BUILDS" != success ]; then
            echo '::error::Tier 1 and Tier 2 Rust checks must all pass.'
            exit 1
          fi
