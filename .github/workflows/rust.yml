name: Rust build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: read
env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip-build
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: runner.os == 'Windows' || inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-${{ matrix.os }}
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Test Windows installer process handling
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_windows_installer_process.py -v
      - name: Test isolated Linux networking
        if: runner.os == 'Linux'
        env:
          # Build as the runner user; elevate only the test executable. Ubuntu
          # runners can restrict the unprivileged user namespaces used locally.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -n --
        run: cargo test --locked --test linux_network -- --ignored --nocapture
      - if: runner.os == 'Windows'
        run: ./apps/rust/scripts/build.ps1 -SkipInstaller
      - if: runner.os == 'Windows' && inputs.release_tag != ''
        run: Copy-Item build/release-version.json apps/rust/dist/sysu_netauth/
      - if: runner.os == 'Linux'
        run: sh apps/rust/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-${{ runner.os }}${{ runner.os == 'Windows' && '-msvc' || '' }}
          path: apps/rust/dist/
          if-no-files-found: error
          overwrite: true
  windows-gnu:
    runs-on: ubuntu-latest
    env:
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: ./.github/actions/cache-apt
        with:
          packages: gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-windows-gnu
          cache-bin: false
      - run: cargo clippy --locked --target x86_64-pc-windows-gnu --all-targets -- -D warnings
      - run: sh apps/rust/scripts/build-windows-gnu.sh
      - if: inputs.release_tag != ''
        run: cp build/release-version.json apps/rust/dist/gnu/sysu_netauth/
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-gnu
          path: apps/rust/dist/gnu/
          if-no-files-found: error
          overwrite: true
  windows-cross:
    runs-on: ubuntu-latest
    env:
      # Keep the SDK outside target/, which rust-cache prunes before saving.
      XWIN_CACHE_DIR: ${{ github.workspace }}/.cache/xwin
      CARGO_XWIN_VERSION: '0.23.1'
      NETAUTH_RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: inputs.release_tag != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - if: inputs.release_tag != ''
        run: python -m pip install -r requirements-build.txt
      - if: inputs.release_tag != ''
        run: python scripts/release_version.py --write
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - id: cross-tools
        uses: ./.github/actions/cache-apt
        with:
          packages: clang llvm lld zip
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-windows-msvc
          cache-bin: false
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST XWIN NETAUTH_RC
      - name: Cache cargo-xwin executable
        id: cargo-xwin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-xwin
          key: cargo-xwin-v1-${{ steps.cross-tools.outputs.platform }}-${{ env.CARGO_XWIN_VERSION }}
      - name: Install cargo-xwin on cache miss
        if: steps.cargo-xwin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-xwin --version "=$CARGO_XWIN_VERSION"
      - name: Verify cached cargo-xwin version
        run: test "$(cargo-xwin --version)" = "cargo-xwin $CARGO_XWIN_VERSION"
      - name: Cache Windows SDK and CRT
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_CACHE_DIR }}
          key: xwin-v2-${{ runner.os }}-${{ runner.arch }}-x86_64-${{ env.CARGO_XWIN_VERSION }}-${{ hashFiles('apps/rust/scripts/build-windows.sh') }}
      - run: sh apps/rust/scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sysu-netauth-Rust-Windows-msvc-from-Linux
          path: apps/rust/dist/sysu-netauth-windows-x64.zip
          if-no-files-found: error
          overwrite: true
