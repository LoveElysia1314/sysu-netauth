[package]
name = "sysu-netauth"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "netauth"

[[bin]]
name = "sysu_netauth"
path = "src/bin/cli.rs"

[[bin]]
name = "sysu_netauth_service"
path = "src/bin/service.rs"

[[bin]]
name = "sysu_netauth_gui"
path = "src/bin/gui.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
md-5 = "0.10"
rpassword = "7"
clap = { version = "4", features = ["derive"] }

[build-dependencies]
git-version = "0.3.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_System_Services", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Environment"] }
